<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早报电台 - 公众号文章语音</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
</head>
<body>
    <div id="alarm-bar" class="alarm-bar" style="display:none">
        <span class="alarm-icon">&#128276;</span>
        <span id="alarm-text" class="alarm-text"></span>
        <button id="alarm-dismiss" class="alarm-dismiss">&times;</button>
    </div>

    <header>
        <div class="header-inner">
            <h1>早报电台</h1>
            <p class="subtitle">猫笔刀 &middot; 刘备教授 &middot; 孥孥的大树 &middot; 卢克文工作室 &middot; 海里的小龙龙 &middot; 远方青木 &middot; 每日语音播报</p>
            <div class="schedule-row">
                <div class="schedule-times">
                    <label class="schedule-label">
                        <input type="checkbox" id="schedule-toggle" checked>
                        定时播放
                    </label>
                    <div id="schedule-slots" class="schedule-slots">
                        <div class="schedule-slot" data-slot="0">
                            <input type="checkbox" class="slot-toggle" checked>
                            <select class="slot-hour">
                                <option value="6">06</option><option value="7">07</option><option value="8" selected>08</option>
                                <option value="9">09</option><option value="10">10</option><option value="11">11</option>
                                <option value="12">12</option><option value="13">13</option><option value="14">14</option>
                                <option value="15">15</option><option value="16">16</option><option value="17">17</option>
                                <option value="18">18</option><option value="19">19</option><option value="20">20</option>
                                <option value="21">21</option><option value="22">22</option><option value="23">23</option>
                            </select>:<select class="slot-minute">
                                <option value="0" selected>00</option><option value="5">05</option><option value="10">10</option>
                                <option value="15">15</option><option value="20">20</option><option value="25">25</option>
                                <option value="30">30</option><option value="35">35</option><option value="40">40</option>
                                <option value="45">45</option><option value="50">50</option><option value="55">55</option>
                            </select>
                        </div>
                        <div class="schedule-slot" data-slot="1">
                            <input type="checkbox" class="slot-toggle" checked>
                            <select class="slot-hour">
                                <option value="6">06</option><option value="7">07</option><option value="8">08</option>
                                <option value="9">09</option><option value="10">10</option><option value="11">11</option>
                                <option value="12" selected>12</option><option value="13">13</option><option value="14">14</option>
                                <option value="15">15</option><option value="16">16</option><option value="17">17</option>
                                <option value="18">18</option><option value="19">19</option><option value="20">20</option>
                                <option value="21">21</option><option value="22">22</option><option value="23">23</option>
                            </select>:<select class="slot-minute">
                                <option value="0" selected>00</option><option value="5">05</option><option value="10">10</option>
                                <option value="15">15</option><option value="20">20</option><option value="25">25</option>
                                <option value="30">30</option><option value="35">35</option><option value="40">40</option>
                                <option value="45">45</option><option value="50">50</option><option value="55">55</option>
                            </select>
                        </div>
                        <div class="schedule-slot" data-slot="2">
                            <input type="checkbox" class="slot-toggle" checked>
                            <select class="slot-hour">
                                <option value="6">06</option><option value="7">07</option><option value="8">08</option>
                                <option value="9">09</option><option value="10">10</option><option value="11">11</option>
                                <option value="12">12</option><option value="13">13</option><option value="14">14</option>
                                <option value="15">15</option><option value="16">16</option><option value="17">17</option>
                                <option value="18">18</option><option value="19">19</option><option value="20" selected>20</option>
                                <option value="21">21</option><option value="22">22</option><option value="23">23</option>
                            </select>:<select class="slot-minute">
                                <option value="0" selected>00</option><option value="5">05</option><option value="10">10</option>
                                <option value="15">15</option><option value="20">20</option><option value="25">25</option>
                                <option value="30">30</option><option value="35">35</option><option value="40">40</option>
                                <option value="45">45</option><option value="50">50</option><option value="55">55</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="btn-play-all" class="btn-play-all" title="播放全部文章">&#9654; 连播</button>
                    <button id="btn-notify" class="btn-notify" title="开启浏览器通知">&#128276;</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section id="today-section" class="today-section" style="display:none">
            <h2>今日早报</h2>
            <div id="today-cards" class="today-cards"></div>
        </section>

        <section class="history-section">
            <h2>历史早报</h2>
            <div id="article-list" class="article-list">
                <p class="loading">加载中...</p>
            </div>
        </section>
    </main>

    <div id="player" class="player" style="display:none">
        <div class="player-inner">
            <div class="player-info">
                <span id="player-source" class="player-source"></span>
                <span id="player-title" class="player-title"></span>
            </div>
            <div class="player-controls">
                <button id="btn-prev" class="player-btn" title="上一篇">&#9198;</button>
                <button id="btn-play" class="player-btn play-btn" title="播放/暂停">&#9654;</button>
                <button id="btn-next" class="player-btn" title="下一篇">&#9197;</button>
            </div>
            <div class="player-progress">
                <span id="time-current">0:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1">
                <span id="time-total">0:00</span>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
