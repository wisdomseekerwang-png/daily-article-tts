name: Daily Article TTS

on:
  schedule:
    # Every hour (UTC) = every hour (HK UTC+8)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install edge-tts httpx

      # ===== Job 1: 刘备教授 (existing) =====
      - name: Fetch 刘备教授 article & generate TTS
        run: python fetch_articles_tts.py --serverless --output-dir ./output
        continue-on-error: true

      # ===== Job 2: 猫笔刀 via RSS =====
      - name: Fetch 猫笔刀 articles via RSS
        run: |
          python scripts/fetch_maobidao.py \
            --output-dir ./output \
            --articles-json ./output/articles_maobidao.json
        continue-on-error: true

      # ===== Job 3: 5公众号 via wxredian =====
      - name: Fetch wxredian state from gh-pages
        run: |
          mkdir -p output
          curl -sL -o output/wxredian_state.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/wxredian_state.json" \
            2>/dev/null || echo '{}' > output/wxredian_state.json

      - name: Fetch 5 authors from wxredian (孥孥/卢克文/远方青木/搬砖小组/龙谈价值)
        run: |
          python scripts/fetch_wxredian.py \
            --output-dir ./output \
            --state-file ./output/wxredian_state.json \
            --articles-json ./output/articles_wxredian.json
        continue-on-error: true

      # ===== Merge & Deploy =====
      - name: Fetch existing articles from gh-pages
        run: |
          mkdir -p output/data
          curl -sL -o output/data/articles.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data/articles.json" \
            2>/dev/null || true
          python scripts/validate_json.py output/data/articles.json 2>/dev/null || echo '[]' > output/data/articles.json

      - name: Merge wxredian + maobidao articles into main articles.json
        run: |
          python3 -c "
          import json
          # Load existing
          try:
              with open('output/data/articles.json') as f:
                  existing = json.load(f)
          except:
              existing = []

          existing_keys = {(a.get('date',''), a.get('source','')) for a in existing}
          existing_urls = {a.get('url','') for a in existing if a.get('url')}
          existing_titles = {(a.get('source',''), a.get('title','')) for a in existing}

          def merge_articles(new_file, label):
              try:
                  with open(new_file) as f:
                      new = json.load(f)
              except:
                  new = []
              added = 0
              for a in new:
                  key = (a.get('date',''), a.get('source',''))
                  if key in existing_keys:
                      continue
                  if a.get('url') and a['url'] in existing_urls:
                      continue
                  title_key = (a.get('source',''), a.get('title',''))
                  if title_key in existing_titles:
                      continue
                  existing.append(a)
                  existing_keys.add(key)
                  if a.get('url'):
                      existing_urls.add(a['url'])
                  existing_titles.add(title_key)
                  added += 1
              print(f'Merged: {added} new from {label}')
              return added

          total = merge_articles('output/articles_wxredian.json', 'wxredian')
          total += merge_articles('output/articles_maobidao.json', 'maobidao')

          existing.sort(key=lambda x: x.get('date',''), reverse=True)
          with open('output/data/articles.json', 'w', encoding='utf-8') as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)
          print(f'Total: {len(existing)} articles, {total} new')

          # Also merge MP3s into dist/audio for deploy
          import shutil, os
          if os.path.isdir('output/audio'):
              os.makedirs('dist/audio', exist_ok=True)
              for f in os.listdir('output/audio'):
                  if f.endswith('.mp3'):
                      shutil.copy2(f'output/audio/{f}', f'dist/audio/{f}')
                      print(f'Copied audio: {f}')
          "

      - name: Merge articles & build
        run: python scripts/merge_and_build.py

      - name: Copy wxredian MP3s to dist
        run: |
          mkdir -p dist/audio
          if [ -d "output/audio" ]; then
            cp output/audio/*.mp3 dist/audio/ 2>/dev/null || true
          fi

      - name: Copy static audio files
        run: |
          if [ -d "static-audio" ]; then
            cp static-audio/*.mp3 dist/audio/ 2>/dev/null || true
          fi

      - name: Copy wxredian state to dist for next run
        run: |
          if [ -f "output/wxredian_state.json" ]; then
            cp output/wxredian_state.json dist/wxredian_state.json
          fi

      # ===== CI 运行日志 =====
      - name: Fetch existing run log from gh-pages
        run: |
          curl -sL -o output/existing_run_log.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data/tts_run_log.json" \
            2>/dev/null || echo '[]' > output/existing_run_log.json

      - name: Generate CI run log & merge with existing
        run: |
          python3 -c "
          import json, os
          from datetime import datetime, timezone, timedelta

          CN_TZ = timezone(timedelta(hours=8))
          now = datetime.now(CN_TZ).strftime('%Y-%m-%d %H:%M:%S')

          # Load existing log from gh-pages
          try:
              with open('output/existing_run_log.json') as f:
                  existing = json.load(f)
          except:
              existing = []

          # Load run log from fetch_articles_tts.py (serverless mode)
          try:
              with open('output/tts_run_log.json') as f:
                  serverless_log = json.load(f)
          except:
              serverless_log = []

          # Load wxredian summary
          try:
              with open('output/wxredian_summary.json') as f:
                  wxredian_summary = json.load(f)
          except:
              wxredian_summary = {}

          # Load maobidao articles
          try:
              with open('output/articles_maobidao.json') as f:
                  maobidao_articles = json.load(f)
          except:
              maobidao_articles = []

          # Generate run log entries for wxredian authors
          wxredian_entries = []
          wxredian_sources = ['孥孥的大树', '卢克文工作室', '远方青木', '搬砖小组', '龙谈价值2023']
          # Track which sources had new articles from wxredian
          wxredian_new_sources = {a['source'] for a in wxredian_summary.get('new_articles', [])}

          for src in wxredian_sources:
              if src in wxredian_new_sources:
                  # Find the article details
                  art = next((a for a in wxredian_summary['new_articles'] if a['source'] == src), None)
                  wxredian_entries.append({
                      'timestamp': now,
                      'source': src,
                      'title': art['title'] if art else '',
                      'audio': art.get('audio', '') if art else '',
                      'status': 'ok' if art and art.get('audio') else 'fail',
                      'mode': 'CI'
                  })
              else:
                  # No new article for this source
                  wxredian_entries.append({
                      'timestamp': now,
                      'source': src,
                      'title': '',
                      'audio': '',
                      'status': 'skip',
                      'mode': 'CI',
                      'reason': '今日无新文章'
                  })

          # Generate run log entry for 猫笔刀 (maobidao)
          maobidao_entries = []
          today_maobidao = [a for a in maobidao_articles if a.get('date') == now[:10]]
          if today_maobidao:
              for a in today_maobidao:
                  maobidao_entries.append({
                      'timestamp': now,
                      'source': '猫笔刀',
                      'title': a.get('title', ''),
                      'audio': a.get('audio', ''),
                      'status': 'ok' if a.get('audio') else 'fail',
                      'mode': 'CI'
                  })
          else:
              maobidao_entries.append({
                  'timestamp': now,
                  'source': '猫笔刀',
                  'title': '',
                  'audio': '',
                  'status': 'skip',
                  'mode': 'CI',
                  'reason': '今日无新文章'
              })

          # Merge all new entries
          all_new = serverless_log + wxredian_entries + maobidao_entries

          # Dedup by (timestamp, source)
          existing_keys = {(e.get('timestamp', ''), e.get('source', '')) for e in existing}
          added = 0
          for entry in all_new:
              key = (entry.get('timestamp', ''), entry.get('source', ''))
              if key not in existing_keys:
                  existing.append(entry)
                  added += 1

          # Sort by timestamp desc, max 500
          existing.sort(key=lambda x: x.get('timestamp', ''), reverse=True)
          existing = existing[:500]

          # Write to dist/data
          os.makedirs('dist/data', exist_ok=True)
          with open('dist/data/tts_run_log.json', 'w', encoding='utf-8') as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)

          print(f'CI run log: {added} new entries merged, {len(existing)} total')
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-articles-${{ github.run_number }}
          path: output/
          retention-days: 7
