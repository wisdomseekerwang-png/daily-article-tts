name: Daily Article TTS

on:
  schedule:
    # UTC 00:00 = HK 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install edge-tts httpx

      - name: Fetch existing articles from gh-pages
        run: |
          mkdir -p output/data
          curl -sL -o output/data/articles.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data/articles.json" \
            2>/dev/null || true
          python scripts/validate_json.py output/data/articles.json 2>/dev/null || echo '[]' > output/data/articles.json

      - name: Fetch articles & generate TTS
        run: python fetch_articles_tts.py --serverless --output-dir ./output

      - name: Merge articles & build
        run: python scripts/merge_and_build.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-articles-${{ github.run_number }}
          path: output/
          retention-days: 7
